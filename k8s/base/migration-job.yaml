apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-analytics-service
spec:
  template:
    metadata:
      # --- AJOUT CRUCIAL ---
      labels:
        app: analytics-service 
      # ---------------------
    spec:
      imagePullSecrets:
        - name: registry-yeta-registry
      containers:
        - name: db-migrate
          image: registry.digitalocean.com/yeta-registry/analytics-service
          #command: ["/bin/sh", "-c", "bundle exec rails db:migrate"]
          command: ["/bin/sh", "-c", "bundle exec rails db:migrate db:seed"]
          env:
            #- name: RAILS_ENV
            #  value: production
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: rails-secret-analytics-service
                  key: RAILS_MASTER_KEY
          envFrom:
            - secretRef:
                name: analytics-service-env
            - secretRef:
                name: analytics-service-db
          volumeMounts:
            - name: rsa-keys-volume
              mountPath: /app/config/keys
              readOnly: true
      volumes:
        - name: rsa-keys-volume
          secret:
            secretName: analytics-service-keys
            items:
              # Mapping : Clé du secret -> Chemin relatif dans mountPath
              - key: jwt-public-key
                path: jwt/user-service.pem
              - key: interservice-private-key
                path: interservice/private.pem
              - key: interservice-user-service-key
                path: interservice/user-service.pem
      restartPolicy: OnFailure