apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
     # --- C'EST ICI QU'IL DOIT ÊTRE PLACÉ ---
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: analytics-service
      # ---------------------------------------

      imagePullSecrets:
        - name: registry-yeta-registry
      containers:
        - name: analytics-service
          image: registry.digitalocean.com/yeta-registry/analytics-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          
          # --- AJOUTS RÉSEAU & RESSOURCES OPTIMISÉS ---
          resources:
            requests:
              cpu: "100m"      # Allocation garantie pour stabiliser le HPA
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health    # Vérifie l'endpoint de santé Rails
              port: 3000
            initialDelaySeconds: 45  # Temps de boot (Puma + DB + RabbitMQ)
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          # --------------------------------------------

          command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
          
          env:
            #- name: RAILS_ENV
            #  value: production
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: rails-secret-analytics-service
                  key: RAILS_MASTER_KEY
          
          # Injection automatique des variables PRODUCTION_POSTGRES_...
          envFrom:
            - secretRef:
                name: analytics-service-env    # Contient RAILS_ENV, URLs, et Timeouts
            - secretRef:
                name: analytics-service-db # Contient les infos DB
            - secretRef:
                name: rabbitmq-credentials # Contient les accès RabbitMQ

          volumeMounts:
            - name: rsa-keys-volume
              mountPath: /app/config/keys
              readOnly: true

      volumes:
        - name: rsa-keys-volume
          secret:
            secretName: analytics-service-keys
            items:
              # Mapping : Clé du secret -> Chemin relatif dans mountPath
              - key: jwt-public-key
                path: jwt/user-service.pem
              - key: interservice-private-key
                path: interservice/private.pem
              - key: interservice-user-service-key
                path: interservice/user-service.pem