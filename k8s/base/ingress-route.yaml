apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: analytics-service-route
  #namespace: production
spec:
  entryPoints:
    #- websecure
    - web
  routes:
    - match: Host(`api.yetaplus.com`) && (PathPrefix(`/api/v1/ratings`))
      kind: Rule
      priority: 500 # Priorité haute pour passer devant la gateway globale
      services:
        - name: analytics-service
          port: 80
      middlewares:
        - name: analytics-service-headers
        - name: analytics-service-compress
        - name: analytics-service-buffering
        - name: api-gateway-ratelimit
        # - name: strip-api-prefix # À garder si Rails répond 404 plus tard
  #tls:
  #  secretName: yeta-api-tls